services:
  # --- SERVICIO BACKEND (PYTHON/FLASK) ---
  backend:
    build: 
      context: ./backend
    container_name: brain-viz-backend
    ports:
      - "0:5000" # Puerto dinámico: el host asigna un puerto libre
    volumes:
      - ./backend/src:/app/src:delegated
      - ./backend/data:/app/data:delegated
    environment:
      - FLASK_ENV=development

  # --- SERVICIO FRONTEND (REACT/THREE.JS) ---
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brain-viz-frontend
    ports:
      - "0:5173" # Puerto dinámico: el host asigna un puerto libre
    volumes:
      - ./frontend/src:/app/src:delegated  # Hot-Reloading: cambios en src se ven al instante
      - ./frontend/vite.config.js:/app/vite.config.js:delegated
      # TRUCO IMPORTANTE: Esto evita que tu carpeta local vacía borre 
      # los node_modules instalados dentro del contenedor
      - /app/node_modules 
    depends_on:
      - backend # Espera a que el backend exista antes de iniciar

networks:
  default:
    name: brain-net