# Configuración de despliegue en Render (https://render.com).
# Con este fichero en la raíz del repositorio, Render detecta el servicio
# automáticamente ("Blueprint") y no hay que rellenar el formulario a mano.
services:
  - type: web
    name: brain-viz
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon             # debe coincidir con la de la base de datos,
                               # para que se comuniquen por la red privada
    plan: free
    branch: main
    healthCheckPath: /health   # Render comprueba aquí que el servicio está vivo
    autoDeploy: true           # cada push a main vuelve a desplegar
    envVars:
      # Clave con la que se firma la cookie de sesión; Render genera un valor
      # aleatorio la primera vez y lo conserva entre despliegues.
      - key: SECRET_KEY
        generateValue: true
      # La cookie de sesión solo debe viajar por HTTPS
      - key: COOKIE_SEGURA
        value: "1"
      # Base de datos. Sin esta variable la aplicación usa un fichero SQLite
      # dentro del contenedor, que se pierde en cada despliegue. Apuntándola a
      # una base de datos externa, los usuarios y las redes cargadas persisten.
      - key: DATABASE_URL
        sync: false
      # Cuenta de administrador inicial. Se definen desde el panel de Render
      # para no dejar credenciales escritas en el repositorio.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOMBRE
        sync: false
